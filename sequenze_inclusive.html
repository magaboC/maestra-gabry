<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metti in ordine la giornata | Maestra Gabry</title><style>body{font-family:Arial,sans-serif;background:#fff9ed;color:#173a49;margin:0}main{max-width:760px;margin:auto;padding:24px}h1{font-size:clamp(28px,5vw,44px)}p{line-height:1.6}button,a{font:inherit}button{border:2px solid #176c78;border-radius:16px;background:white;color:#173a49;padding:18px;min-height:65px;cursor:pointer;font-size:20px}button:focus-visible,a:focus-visible{outline:4px solid orange}button:disabled{opacity:.65}#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.panel{background:white;border-radius:20px;padding:24px;margin:20px 0;box-shadow:0 4px 16px #0001}.pill{background:#176c78;color:white;border-radius:12px;padding:12px 18px;display:inline-block;text-decoration:none}#feedback{font-weight:bold;font-size:22px;min-height:36px}.big{font-size:42px}#sequence{font-size:26px;min-height:45px;word-break:break-word}.hint{background:#e8f4e7;border-radius:12px;padding:12px}</style></head><body><main><a href="index.html#inclusione">← Torna al sito</a><h1>🧩 Metti in ordine la giornata</h1><p>Una missione alla volta. Tocca le immagini nell'ordine giusto.</p><div class="panel"><p id="progress" aria-live="polite"></p><h2 id="instruction"></h2><p id="sequence" aria-label="Sequenza scelta"></p><div id="choices"></div><p id="feedback" role="status"></p><button id="retry" hidden>Riprova</button><button id="next" hidden>Prossima missione →</button></div><p class="hint">Per la maestra: leggi la consegna ad alta voce, lascia tutto il tempo necessario e usa le immagini come supporto. Non ci sono penalità né timer.</p></main><script>const missions=[{title:'Prepararsi al mattino',steps:[['🛏️','Mi sveglio'],['🪥','Lavo i denti'],['🎒','Prendo lo zaino']]},{title:'Lavare le mani',steps:[['🚰','Apro l’acqua'],['🧼','Uso il sapone'],['👐','Asciugo le mani']]},{title:'Coltivare una piantina',steps:[['🌱','Metto il seme'],['💧','Do acqua'],['🌻','Cresce il fiore']]}];let level=0,chosen=[];const $=id=>document.getElementById(id);function render(){let m=missions[level];$('progress').textContent='Missione '+(level+1)+' di '+missions.length;$('instruction').textContent=m.title;$('sequence').textContent=chosen.map(i=>m.steps[i][0]).join(' → ')||'Scegli la prima immagine';$('choices').replaceChildren();const order=[2,0,1];for(let i of order){if(chosen.includes(i))continue;let b=document.createElement('button');b.textContent=m.steps[i][0]+' '+m.steps[i][1];b.onclick=()=>pick(i);$('choices').append(b)}}function pick(i){if(i!==chosen.length){$('feedback').textContent='Prova ancora: quale azione viene prima?';return}chosen.push(i);$('feedback').textContent='Benissimo!';render();if(chosen.length===3){$('feedback').textContent='🎉 Sequenza completata!';$('next').hidden=false}}$('next').onclick=()=>{if(level===missions.length-1){$('instruction').textContent='🎉 Hai completato tutte le missioni!';$('choices').replaceChildren();$('sequence').textContent='Bravissimo!';$('progress').textContent='3 missioni completate';$('next').hidden=true;$('retry').hidden=false;$('feedback').textContent='';return}level++;chosen=[];$('next').hidden=true;$('feedback').textContent='';render()};$('retry').onclick=()=>{level=0;chosen=[];$('retry').hidden=true;render()};render();</script><script src="/visite-pagine.js" defer></script></body></html>
