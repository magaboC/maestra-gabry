<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174e63"><title>La macchina del tempo | Maestra Gabry</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#17364b;background:#f8f4e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#fff1b9,transparent 36%),linear-gradient(135deg,#f8f4e9,#dff2ee);min-height:100vh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #f5b83b;outline-offset:3px}.shell{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;color:#17657a}.chip{background:white;border:2px solid #cbe1dc;border-radius:999px;padding:9px 15px;font-weight:750}.panel{background:#fffdf8;border:3px solid #cfe3dd;border-radius:28px;box-shadow:0 14px 35px #1849581c;padding:clamp(18px,4vw,35px);margin-top:18px}.hero{display:grid;grid-template-columns:1.4fr .8fr;align-items:center;gap:15px}.hero h1{font-size:clamp(32px,5vw,57px);line-height:1.08;margin:10px 0;color:#164d63}.eyebrow{font-weight:900;color:#ad6722;letter-spacing:.08em}.lead{font-size:clamp(17px,2vw,21px);line-height:1.55}.art{font-size:clamp(80px,15vw,150px);text-align:center;filter:drop-shadow(0 8px 0 #d9bb75)}.btn{border:0;border-radius:17px;background:#17677a;color:white;font-weight:850;padding:15px 22px;min-height:54px;box-shadow:0 5px 0 #0c3f4e}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0c3f4e}.btn.alt{background:#f7cb60;color:#283e44;box-shadow:0 5px 0 #d5a640}.btn.ghost{background:#eef5f3;color:#245364;box-shadow:none;border:2px solid #bcd9d5}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}.level{border:2px solid #d5e5e0;background:#f5fbf9;border-radius:20px;padding:16px;text-align:left;min-height:135px;color:#17495d}.level strong{display:block;font-size:18px;margin:8px 0}.level small{color:#506873}.level.locked{opacity:.55}.level.done{border-color:#67b884;background:#eaf9eb}.progress{height:13px;background:#dce8e6;border-radius:100px;overflow:hidden;margin:13px 0}.bar{height:100%;background:linear-gradient(90deg,#73b987,#f3bd4b);transition:width .25s}.question{font-size:clamp(24px,3.5vw,37px);line-height:1.25;margin:18px 0 22px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{min-height:78px;text-align:left;padding:15px 18px;border:3px solid #bddbd6;border-radius:17px;background:#f7fbfa;color:#193f51;font-size:clamp(17px,2.2vw,22px);font-weight:750}.choice:hover:not(:disabled){background:#e8f5f1;border-color:#25859a}.choice:disabled{cursor:default}.choice.correct{background:#d8f3df;border-color:#3c9d62}.choice.wrong{background:#ffe0dc;border-color:#d9695e}.feedback{border-radius:17px;padding:16px 18px;margin-top:16px;background:#eaf3fa;font-size:18px;line-height:1.5}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:750}.stars{font-size:30px;letter-spacing:4px}.name{width:min(100%,400px);border:2px solid #93b7b6;border-radius:12px;padding:13px;font-size:19px}.certificate{border:7px double #d7a64a;background:#fff9e8;text-align:center;padding:30px 20px;border-radius:20px}.certificate h2{font-size:clamp(29px,5vw,45px);color:#155b70}.foot{text-align:center;color:#55717c;padding:22px;font-size:14px}.hidden{display:none!important}@media(max-width:650px){.hero{grid-template-columns:1fr}.art{font-size:90px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.choices{grid-template-columns:1fr}.panel{border-radius:20px}.shell{padding:10px}}@media print{body{background:white}.top,.actions,.foot{display:none!important}.panel{box-shadow:none;border:0}.certificate{break-inside:avoid}}
</style></head><body><main class="shell"><header class="top"><div class="brand">🌈 Maestra Gabry <span style="font-weight:500">· Piccoli passi, grandi scoperte</span></div><div class="chip" id="headerScore">⭐ 0 punti</div></header><section class="panel" id="app" aria-live="polite"></section><footer class="foot">Gioco educativo originale · Classe 4ª · Funziona offline · Nessuna registrazione richiesta</footer></main><script>
'use strict';
const levels=[
{icon:'⏳',name:'La linea del tempo',intro:'Scopri come gli storici ordinano gli eventi.',qs:[['Che cosa indica la linea del tempo?',['L’ordine degli eventi','La distanza tra le città','Il tempo atmosferico','La lunghezza dei fiumi'],0,'La linea del tempo mette gli eventi in ordine cronologico.'],['Quale evento è avvenuto prima?',['Un evento del 1000 a.C.','Un evento del 500 a.C.','Un evento del 100 d.C.','Un evento del 2020 d.C.'],0,'Negli anni avanti Cristo, il numero più grande indica una data più antica.'],['Che cosa significa a.C.?',['Avanti Cristo','Anno corrente','Antica città','Anno completo'],0,'a.C. significa avanti Cristo.']]},
{icon:'🔎',name:'Le fonti storiche',intro:'Diventa un investigatore del passato.',qs:[['Quale tra questi è una fonte scritta?',['Una lettera antica','Un vaso di terracotta','Un osso fossile','Una moneta senza iscrizioni'],0,'Le lettere antiche sono testimonianze scritte.'],['A che cosa serve un reperto archeologico?',['A conoscere il passato','A prevedere il futuro','A misurare la pioggia','A disegnare una mappa moderna'],0,'Gli oggetti ritrovati ci aiutano a ricostruire la vita di un tempo.'],['Chi studia le tracce lasciate dalle persone del passato?',['Lo storico','Il meteorologo','Il pilota','Il cuoco'],0,'Lo storico studia il passato usando le fonti.']]},
{icon:'🌊',name:'La Mesopotamia',intro:'Viaggia nella terra tra due fiumi.',qs:[['Che cosa significa Mesopotamia?',['Terra tra due fiumi','Terra delle montagne','Isola nel mare','Terra senza acqua'],0,'Il nome significa terra tra i fiumi.'],['Quali fiumi attraversano la Mesopotamia?',['Tigri ed Eufrate','Po e Tevere','Nilo e Amazzoni','Senna e Tamigi'],0,'Tigri ed Eufrate resero fertili molte terre.'],['Perché i fiumi erano importanti?',['Per irrigare i campi','Per costruire automobili','Per produrre elettricità nelle case','Per far nevicare'],0,'L’acqua permetteva di coltivare e sostenere gli insediamenti.']]},
{icon:'🏛️',name:'I Sumeri',intro:'Esplora le prime città della Mesopotamia.',qs:[['Come si chiamavano molte città sumere indipendenti?',['Città-stato','Regioni italiane','Colonie spaziali','Province moderne'],0,'Le città-stato avevano un proprio governo e territorio.'],['Come si chiama la scrittura sviluppata dai Sumeri?',['Cuneiforme','Braille','Alfabeto latino','Geroglifica maya'],0,'I segni cuneiformi venivano impressi su tavolette d’argilla.'],['Che cos’era una ziqqurat?',['Un edificio religioso a terrazze','Una barca da pesca','Un tipo di moneta','Un animale da soma'],0,'La ziqqurat era una grande costruzione religiosa a gradoni.']]},
{icon:'⚖️',name:'I Babilonesi',intro:'Scopri leggi e città dell’antichità.',qs:[['Quale importante città diede il nome ai Babilonesi?',['Babilonia','Roma','Atene','Cartagine'],0,'Babilonia fu un importante centro della Mesopotamia.'],['Per che cosa è ricordato Hammurabi?',['Un famoso codice di leggi','La scoperta dell’America','La stampa dei libri','La costruzione delle piramidi egizie'],0,'Il Codice di Hammurabi raccoglieva numerose leggi.'],['A che cosa servivano le leggi?',['A stabilire regole per la società','A cambiare le stagioni','A contare le stelle','A scegliere il colore delle case'],0,'Le leggi regolavano diversi aspetti della vita sociale.']]},
{icon:'🛡️',name:'Gli Ittiti',intro:'Conosci un popolo dell’Anatolia.',qs:[['In quale regione si sviluppò il regno ittita?',['Anatolia','Scandinavia','Australia','America del Sud'],0,'Gli Ittiti si svilupparono soprattutto in Anatolia, nell’attuale Turchia.'],['Quale metallo impararono a lavorare, insieme ad altri popoli antichi?',['Ferro','Alluminio','Titanio','Plutonio'],0,'Gli Ittiti sono spesso associati alla lavorazione del ferro.'],['Quale mezzo utilizzavano anche in guerra?',['Carri trainati da cavalli','Automobili','Aeroplani','Sottomarini'],0,'I carri da guerra erano importanti per molti eserciti antichi, inclusi gli Ittiti.']]}];
let state={screen:'home',level:0,q:0,score:0,unlocked:0,done:[],selected:null,correctCount:0};
const app=document.getElementById('app');const scoreEl=document.getElementById('headerScore');
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(label,fn,klass='btn'){return `<button class="${klass}" data-action="${fn}">${label}</button>`}
function render(){scoreEl.textContent=`⭐ ${state.score} punti`;let h='';
if(state.screen==='home'){h=`<div class="hero"><div><div class="eyebrow">MISSIONE STORIA · CLASSE 4ª</div><h1>La macchina del tempo! 🚀</h1><p class="lead">Sei pronto a viaggiare nel passato? Supera <b>6 livelli</b>, raccogli i medaglioni e conquista il diploma di <b>Piccolo Storico</b>!</p><div class="actions">${button('🚀 Inizia l’avventura','start')}${button('📚 Come si gioca','rules','btn ghost')}</div></div><div class="art" aria-hidden="true">🕰️🌍</div></div>`}
if(state.screen==='rules'){h=`<h1>📚 Come si gioca</h1><p class="lead">Completa i sei livelli in ordine. Ogni livello ha tre domande. Per ogni risposta giusta ottieni <b>10 punti</b>. Se sbagli, leggi l’aiuto e vai avanti: potrai riprovare il livello alla fine.</p><p class="lead">Per sbloccare il livello successivo servono almeno <b>2 risposte corrette su 3</b>. Non c’è un timer: ragiona con calma!</p><div class="actions">${button('Vai ai livelli','start')}${button('Torna all’inizio','home','btn ghost')}</div>`}
if(state.screen==='map'){h=`<div class="eyebrow">IL TUO VIAGGIO NEL TEMPO</div><h1>🗺️ Scegli una missione</h1><p>Completa ogni missione per sbloccare la successiva.</p><div class="progress"><div class="bar" style="width:${Math.round(state.done.length/6*100)}%"></div></div><div class="stats"><span>🏅 ${state.done.length} / 6 medaglioni</span><span>⭐ ${state.score} punti</span></div><div class="levels">${levels.map((l,i)=>`<button class="level ${i>state.unlocked?'locked':''} ${state.done.includes(i)?'done':''}" data-action="level" data-index="${i}" ${i>state.unlocked?'disabled':''}><span style="font-size:30px">${i>state.unlocked?'🔒':l.icon}</span><strong>${i+1}. ${safe(l.name)}</strong><small>${state.done.includes(i)?'🏅 Completato':i<=state.unlocked?'Tocca per giocare':'Da sbloccare'}</small></button>`).join('')}</div><div class="actions">${button('🏠 Home','home','btn ghost')}${state.done.length===6?button('🎓 Il mio diploma','certificate','btn alt'):''}</div>`}
if(state.screen==='intro'){let l=levels[state.level];h=`<div class="eyebrow">LIVELLO ${state.level+1} DI 6</div><div class="art">${l.icon}</div><h1>${safe(l.name)}</h1><p class="lead">${safe(l.intro)}</p><p>Tre domande per ottenere il medaglione. Servono almeno due risposte corrette!</p><div class="actions">${button('🎮 Inizia il livello','question')}${button('Torna alla mappa','map','btn ghost')}</div>`}
if(state.screen==='question'){let l=levels[state.level],q=l.qs[state.q],selected=state.selected;h=`<div class="stats"><span>${l.icon} Livello ${state.level+1}: ${safe(l.name)}</span><span>Domanda ${state.q+1} / 3</span></div><div class="progress"><div class="bar" style="width:${(state.q+(selected!==null?1:0))/3*100}%"></div></div><h1 class="question">${safe(q[0])}</h1><div class="choices">${q[1].map((o,i)=>`<button class="choice ${selected!==null?(i===q[2]?'correct':i===selected?'wrong':''):''}" data-action="answer" data-index="${i}" ${selected!==null?'disabled':''}>${['A','B','C','D'][i]}. ${safe(o)}</button>`).join('')}</div>${selected!==null?`<div class="feedback" role="status"><b>${selected===q[2]?'🎉 Risposta esatta! +10 punti':'💡 Non proprio, ma stai imparando!'}</b><br>${safe(q[3])}</div><div class="actions">${button(state.q===2?'Vedi il risultato 🏅':'Prossima domanda →','next')}</div>`:''}`}
if(state.screen==='result'){let ok=state.correctCount>=2;h=`<div class="art">${ok?'🏅':'💪'}</div><h1>${ok?'Missione completata!':'Ci sei quasi!'}</h1><p class="lead">Hai risposto correttamente a <b>${state.correctCount} domande su 3</b>.</p><p>${ok?'Hai conquistato il medaglione e sbloccato una nuova missione!':'Per conquistare il medaglione servono almeno 2 risposte corrette. Riprova: puoi farcela!'}</p><div class="actions">${button(ok?'🗺️ Continua il viaggio':'🔁 Riprova il livello',ok?'map':'retry')}${button('Torna alla mappa','map','btn ghost')}</div>`}
if(state.screen==='certificate'){h=`<div class="certificate"><div style="font-size:62px">🏆</div><div class="eyebrow">MAESTRA GABRY PRESENTA</div><h2>Diploma di Piccolo Storico</h2><p>Conferito a</p><input class="name" id="student" maxlength="55" placeholder="Scrivi il tuo nome" aria-label="Nome dell’alunno"><p>per aver completato le sei missioni della Macchina del Tempo!</p><div class="stars">🏅 🏅 🏅 🏅 🏅 🏅</div><p><b>Punteggio totale: ${state.score} punti</b></p><p>🌈 Piccoli passi, grandi scoperte</p></div><div class="actions">${button('🖨️ Stampa il diploma','print')}${button('🗺️ Torna alla mappa','map','btn ghost')}${button('🔄 Nuova partita','reset','btn alt')}</div>`}
app.innerHTML=h}
function go(screen){state.screen=screen;render();window.scrollTo({top:0,behavior:'instant'})}
function startLevel(i){if(i>state.unlocked)return;state.level=i;state.q=0;state.correctCount=0;state.selected=null;go('intro')}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.index);if(a==='home')go('home');else if(a==='rules')go('rules');else if(a==='start'||a==='map')go('map');else if(a==='level')startLevel(i);else if(a==='question')go('question');else if(a==='answer'&&state.selected===null){state.selected=i;if(i===levels[state.level].qs[state.q][2]){state.score+=10;state.correctCount++}render()}else if(a==='next'){if(state.q<2){state.q++;state.selected=null;render()}else{if(state.correctCount>=2){if(!state.done.includes(state.level))state.done.push(state.level);state.unlocked=Math.max(state.unlocked,Math.min(5,state.level+1))}go('result')}}else if(a==='retry')startLevel(state.level);else if(a==='certificate')go('certificate');else if(a==='print')window.print();else if(a==='reset'){state={screen:'home',level:0,q:0,score:0,unlocked:0,done:[],selected:null,correctCount:0};render()}});
render();
</script><script src="/visite-pagine.js" defer></script></body></html>
